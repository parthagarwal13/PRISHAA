<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISHAA Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,Helvetica,sans-serif;background:#fff1f6;color:#321824}
.card{width:min(440px,92vw);background:#fff;padding:34px;border-radius:24px;
box-shadow:0 20px 60px rgba(54,20,37,.13);border:1px solid #ecdde5}
.brand{text-align:center;color:#aa3d69;font-size:42px;font-weight:800;letter-spacing:.3px}
.sub{text-align:center;margin-top:6px;letter-spacing:3px;font-size:12px;font-weight:800;color:#7d2c4d}
h1{text-align:center;font-size:23px;margin:28px 0 8px}
.note{text-align:center;color:#725f68;margin-bottom:22px}
input{width:100%;padding:14px;border:1px solid #e6d8df;border-radius:12px;font-size:16px}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#aa3d69;
color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.error{margin-top:14px;color:#9a2424;background:#ffe9e9;border-radius:10px;padding:10px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="brand">PRISHAA</div>
  <div class="sub">WOMEN'S COLLECTION</div>
  <h1>Admin Access</h1>
  <div class="note">Enter the admin password to continue.</div>
  <form method="post" action="/admin/login">
    <input type="password" name="password" placeholder="Admin password" required autofocus>
    <button type="submit">Login to Admin</button>
  </form>
  <div class="error" id="error" style="display:none"></div>
</div>
<script>
if(location.search.includes("error=1")){
  const e=document.getElementById("error");
  e.textContent="Incorrect password.";
  e.style.display="block";
}
</script>
</body>
</html>
